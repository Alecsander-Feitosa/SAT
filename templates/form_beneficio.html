{% extends "base.html" %}

{% block content %}
<style>
    .peer:checked + .opcao-nivel { background-color: var(--cor-primaria) !important; color: var(--cor-secundaria) !important; border-color: var(--cor-primaria) !important; }
</style>
<div class="w-full min-h-screen fundo-app flex flex-col pb-32">
    <div class="sticky top-[70px] z-40 fundo-card border-b border-suave shadow-sm px-5 py-4 flex items-center gap-4">
        <a href="{% url 'painel_planos' %}" class="texto-main text-2xl no-underline"><i class="bi bi-arrow-left"></i></a>
        <h1 class="text-xl font-black italic uppercase tracking-tighter texto-main leading-none">{% if beneficio %}Editar{% else %}Novo{% endif %} <span class="texto-tema">Benefício</span></h1>
    </div>

    <form method="post" class="px-5 pt-6 space-y-4">
        {% csrf_token %}
        <div class="space-y-1">
            <label class="text-[9px] font-black opacity-50 uppercase tracking-widest ml-1 texto-main">Liberado a partir do plano</label>
            <div class="grid grid-cols-4 gap-2">
                {% for valor, nome in niveis %}
                <label class="cursor-pointer">
                    <input type="radio" name="nivel_minimo" value="{{ valor }}" class="peer sr-only" {% if beneficio %}{% if beneficio.nivel_minimo == valor %}checked{% endif %}{% elif nivel_inicial == valor %}checked{% endif %}>
                    <span class="opcao-nivel block text-center fundo-card border border-suave rounded-xl py-3 text-[10px] font-black uppercase texto-main transition-all">{{ nome }}</span>
                </label>
                {% endfor %}
            </div>
            <p class="text-[10px] texto-main opacity-50 ml-1">Vale também para os planos acima dele.</p>
        </div>

        <div class="space-y-1">
            <label class="text-[9px] font-black opacity-50 uppercase tracking-widest ml-1 texto-main">Benefício</label>
            <input type="text" name="titulo" required maxlength="120" value="{{ beneficio.titulo|default:'' }}" placeholder="Ex: 10% de desconto na sede"
                class="w-full fundo-card border border-suave rounded-xl px-4 py-3.5 text-xs font-bold texto-main outline-none focus:border-tema">
        </div>

        <div class="space-y-1">
            <label class="text-[9px] font-black opacity-50 uppercase tracking-widest ml-1 texto-main">Detalhes (opcional)</label>
            <input type="text" name="descricao" maxlength="255" value="{{ beneficio.descricao|default:'' }}" placeholder="Ex: Apresentando a carteirinha no bar da sede"
                class="w-full fundo-card border border-suave rounded-xl px-4 py-3.5 text-xs font-bold texto-main outline-none focus:border-tema">
        </div>

        <label class="flex items-center gap-3 p-4 fundo-card rounded-xl border border-suave cursor-pointer">
            <input type="checkbox" name="ativo" class="w-5 h-5" {% if not beneficio or beneficio.ativo %}checked{% endif %}>
            <span class="text-[10px] font-black uppercase texto-main opacity-70">Benefício ativo</span>
        </label>

        <button type="submit" class="w-full py-4 fundo-tema texto-claro rounded-xl font-black uppercase text-[11px] tracking-widest shadow-lg active:scale-95 transition-transform">
            Salvar benefício
        </button>
    </form>
</div>
{% endblock %}
