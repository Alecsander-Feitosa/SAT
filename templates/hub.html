{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
    /* 1. Injetamos as cores dinâmicas no fundo e nos ícones */
    .torcida-bg { 
        background-color: {{ torcida.cor_fundo|default:"#0c0d0e" }}; 
        min-height: 100vh; 
        color: white; 
    }
    
    .hub-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 20px; }
    
    .hub-item { 
        background: rgba(255, 255, 255, 0.05); /* Fundo semi-transparente para combinar com qualquer cor */
        border-radius: 24px; padding: 25px 15px; 
        border: 1px solid rgba(255, 255, 255, 0.05); text-align: center;
        text-decoration: none; transition: 0.3s; display: flex; flex-direction: column; align-items: center;
    }
    .hub-item:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.1); }
    
    .hub-item i { 
        font-size: 28px; 
        color: {{ torcida.cor_secundaria|default:"#D37129" }}; /* COR PRIMÁRIA AQUI */
        margin-bottom: 10px; 
    }
    .hub-item span { font-size: 10px; font-weight: 900; color: #f8f9fa; text-transform: uppercase; letter-spacing: 1px; }

    /* Cartão de Sócio Estilo Banco Premium */
    .bank-card {
        background: linear-gradient(135deg, rgba(26, 28, 30, 0.9) 0%, rgba(12, 13, 14, 0.9) 100%);
        border: 1px solid {{ torcida.cor_primaria|default:"#ffffff" }}40; /* Borda leve com a cor da torcida */
        border-radius: 24px;
        aspect-ratio: 1.58/1;
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .card-chip {
        width: 40px; height: 30px;
        background: linear-gradient(135deg, #ffd700, #b8860b);
        border-radius: 6px;
    }
</style>

<div class="torcida-bg pb-40">
    <div class="px-5 pt-10 mb-6">
        <h1 class="text-2xl font-black italic uppercase tracking-tighter">
            {{ torcida.nome|default:"COMUNIDADE" }} 
            <span style="color: {{ torcida.cor_primaria|default:'#D37129' }};">SAT</span>
        </h1>
    </div>

    <div class="flex justify-center w-full px-5 mb-8">
        
        <div class="w-full max-w-sm mx-auto flex flex-col items-center">
            {% include "includes/cartao_socio.html" %}
            <div class="w-full flex items-center justify-between mt-2 px-1">
                <span class="text-[9px] font-black uppercase tracking-widest texto-main opacity-40"><i class="bi bi-hand-index-thumb"></i> Toque para ver o verso</span>
                <a href="{% url 'carteirinha' %}" class="text-[10px] font-black uppercase tracking-wider texto-tema hover:underline">Abrir carteirinha <i class="bi bi-chevron-right"></i></a>
            </div>
        </div>
        
    </div>

    <div class="hub-grid">
        <a href="{% url 'galeria_fotos' torcida.slug %}" class="hub-item">
            <i class="bi bi-images"></i>
            <span>Galeria</span>
        </a>

        <a href="{% url 'diretoria' torcida.slug %}" class="hub-item">
            <i class="bi bi-microsoft"></i>
            <span>Diretoria</span>
        </a>

        <a href="{% url 'mural_conquistas' torcida.slug %}" class="hub-item">
            <i class="bi bi-trophy"></i>
            <span>Conquistas</span>
        </a>

        <a href="{% url 'cancoes' torcida.slug %}" class="hub-item">
            <i class="bi bi-music-note-beamed"></i>
            <span>Canções</span>
        </a>

        <a href="{% url 'lista_eventos' torcida.slug %}" class="hub-item">
            <i class="bi bi-calendar-check"></i>
            <span>Eventos</span>
        </a>

        <a href="{% url 'regras' torcida.slug %}" class="hub-item">
            <i class="bi bi-file-earmark-text"></i>
            <span>Regras</span>
        </a>

        <a href="{% url 'aliadas' torcida.slug %}" class="hub-item">
            <i class="bi bi-shield-check"></i>
            <span>Aliadas</span>
        </a>

        <a href="{% url 'viagens' torcida.slug %}" class="hub-item">
            <i class="bi bi-bus-front"></i>
            <span>Caravanas</span>
        </a>
    </div>
</div>


<script>
</script>
{% endblock %}
