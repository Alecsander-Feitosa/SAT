{% load static painel_sat %}{% cores_painel torcida as cores %}
<style>
    /* ========== TELAS DO MODERADOR · ESTRUTURA DA SAT, CORES DA TORCIDA ========== */
    /* O destaque é a cor primária da torcida (ou outra cor dela, se a primária sumir no fundo) */
    :root {
        --destaque: {{ cores.0 }};
        --destaque-claro: color-mix(in srgb, var(--destaque) 78%, white);
        --texto-destaque: {{ cores.1 }};
        /* destaque usado como cor de texto/ícone: puxado para a cor de texto da torcida para nunca sumir no cartão */
        --destaque-texto: color-mix(in srgb, var(--destaque) 65%, var(--cor-terciaria));
        --sat-noite: #16191A;
        --sat-grafite: #454B4C;
    }

    @keyframes slideUpFade {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .painel-sat .texto-main { text-shadow: none; }

    /* ---------- Topo grafite com o escudo da SAT ---------- */
    .hero-sat {
        position: relative; overflow: hidden; color: #fff;
        background:
            radial-gradient(circle at 90% -20%, color-mix(in srgb, var(--destaque) 45%, transparent) 0%, transparent 55%),
            linear-gradient(160deg, #3a4041 0%, var(--sat-noite) 75%);
        border-radius: 0 0 32px 32px;
        box-shadow: 0 18px 40px rgba(0,0,0,.25);
    }
    .hero-sat.compacto { border-radius: 26px; box-shadow: 0 12px 28px rgba(0,0,0,.18); }
    .hero-sat::before { /* faixa inclinada, como o corte das letras do logo */
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
        background: repeating-linear-gradient(-60deg, var(--destaque) 0 18px, var(--destaque-claro) 18px 26px);
    }
    .hero-escudo {
        position: absolute; right: -40px; bottom: -50px; width: 220px; height: 260px;
        background: url("{% static 'img/logo-shield.png' %}") center / contain no-repeat;
        opacity: .07; filter: grayscale(1) brightness(2.2); pointer-events: none;
    }
    .hero-sat.compacto .hero-escudo { width: 150px; height: 180px; right: -30px; bottom: -40px; }
    .rotulo-hero { color: color-mix(in srgb, var(--destaque) 60%, white); }
    .logo-sat-branco { filter: brightness(0) invert(1); }
    .vidro-sat { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.10); }
    .stat-sat { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; }
    .stat-sat.alerta { background: color-mix(in srgb, var(--destaque) 22%, transparent); border-color: color-mix(in srgb, var(--destaque-claro) 55%, transparent); }

    /* ---------- Abas inclinadas (paralelogramo), no ritmo do itálico da marca ---------- */
    .abas-sat { position: sticky; top: 0; z-index: 40; background: var(--cor-fundo); }
    .abas-sat.solta { position: static; background: transparent; }
    .tab-btn {
        position: relative; transition: all .25s cubic-bezier(.4,0,.2,1);
        clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        border-radius: 0 !important; padding-left: 1.4rem !important; padding-right: 1.4rem !important;
        font-style: italic; letter-spacing: .04em; text-decoration: none;
    }
    .tab-active { background: var(--destaque); color: var(--texto-destaque) !important; box-shadow: 0 6px 18px color-mix(in srgb, var(--destaque) 35%, transparent); }
    .tab-inactive { background: rgba(120,120,120,.10); color: var(--cor-terciaria); opacity: .75; }
    .tab-inactive:hover { opacity: 1; background: color-mix(in srgb, var(--destaque) 12%, transparent); }
    .tab-badge { position: absolute; top: 3px; right: 12px; width: 8px; height: 8px; border-radius: 9999px; background: #ef4444; }

    /* Acentos laranja fixos do painel antigo passam a seguir a torcida (o laranja de 'pendente' fica) */
    .painel-sat .text-orange-500 { color: var(--destaque-texto) !important; }
    .painel-sat .bg-orange-500\/10 { background-color: color-mix(in srgb, var(--destaque) 14%, transparent) !important; }
    .painel-sat .hover\:bg-orange-500\/20:hover { background-color: color-mix(in srgb, var(--destaque) 24%, transparent) !important; }
    .texto-destaque { color: var(--destaque-texto) !important; }

    .secao-conteudo { display: none; }
    .secao-ativa { display: block; animation: slideUpFade 0.4s ease forwards; }
    .modal-backdrop { background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); }

    /* ---------- Janelas de edição (bottom sheets) ---------- */
    .modal-backdrop > div { position: relative; }
    .modal-backdrop > div::before { /* mesma faixa inclinada do topo */
        content: ''; position: absolute; top: 0; left: 28px; right: 28px; height: 4px; border-radius: 0 0 4px 4px;
        background: repeating-linear-gradient(-60deg, var(--destaque) 0 18px, var(--destaque-claro) 18px 26px);
    }
    .modal-backdrop > div > div:first-child > h3 {
        font-style: italic; letter-spacing: -.01em; font-size: 15px; padding-left: 18px; position: relative;
    }
    .modal-backdrop > div > div:first-child > h3::before {
        content: ''; position: absolute; left: 0; top: 50%; width: 10px; height: 16px; transform: translateY(-50%) skewX(-18deg);
        background: var(--destaque); border-radius: 2px;
    }
    .modal-backdrop input.bg-black\/5, .modal-backdrop textarea.bg-black\/5, .modal-backdrop select.bg-black\/5,
    .painel-sat input.bg-black\/5, .painel-sat textarea.bg-black\/5, .painel-sat select.bg-black\/5 {
        background: rgba(120,120,120,.08); color: var(--cor-terciaria); border-radius: 14px;
        transition: border-color .15s, box-shadow .15s;
    }
    .modal-backdrop input:focus, .modal-backdrop textarea:focus, .modal-backdrop select:focus {
        border-color: var(--destaque) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--destaque) 20%, transparent); outline: none;
    }
    .modal-backdrop label { color: var(--cor-terciaria); }
    .modal-backdrop input[type="checkbox"], .modal-backdrop input[type="radio"] { accent-color: var(--destaque); }

    /* ---------- Títulos de seção: itálico pesado com a barrinha inclinada da SAT ---------- */
    .painel-sat h3.border-l-4, .titulo-sat {
        border-left-width: 0 !important; padding-left: 18px; position: relative;
        opacity: 1; font-size: 14px; font-weight: 900; font-style: italic; text-transform: uppercase;
        letter-spacing: -.01em; color: var(--cor-terciaria);
    }
    .painel-sat h3.border-l-4::before, .titulo-sat::before {
        content: ''; position: absolute; left: 0; top: 50%; width: 10px; height: 16px; transform: translateY(-50%) skewX(-18deg);
        background: var(--destaque); border-radius: 2px;
    }
    .painel-sat h3.border-l-4 + p, .painel-sat h3.border-l-4 ~ p, .titulo-sat + p { margin-left: 18px; }

    /* ---------- Cartões ---------- */
    .painel-sat .secao-conteudo .fundo-card, .cartao-sat { border-radius: 20px; transition: border-color .2s, box-shadow .2s, transform .2s; }
    .painel-sat .secao-conteudo .fundo-card:hover, .cartao-sat.clicavel:hover { border-color: color-mix(in srgb, var(--destaque) 45%, transparent) !important; box-shadow: 0 8px 22px rgba(0,0,0,.08); }
    .vazio-sat { text-align: center; padding: 2rem 1rem; border: 1px dashed rgba(150,150,150,.3); border-radius: 20px; }
    .vazio-sat > i, .vazio-sat > p { opacity: .55; }

    /* ---------- Botões ---------- */
    .painel-sat .btn-novo, .btn-sat {
        background: var(--destaque) !important; color: var(--texto-destaque) !important; border-color: transparent !important;
        box-shadow: 0 4px 12px color-mix(in srgb, var(--destaque) 30%, transparent); text-decoration: none; white-space: nowrap;
    }
    .painel-sat .btn-novo:hover, .btn-sat:hover { background: var(--destaque-claro) !important; }
    .btn-sat { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; transition: transform .15s; }
    .btn-sat:active { transform: scale(.97); }
    .btn-sat-sec {
        display: inline-flex; align-items: center; justify-content: center; gap: .4rem; font-weight: 900; text-transform: uppercase; letter-spacing: .08em;
        border: 1px solid rgba(150,150,150,.25); color: var(--cor-terciaria); background: rgba(120,120,120,.08); text-decoration: none;
    }
    .btn-sat-sec:hover { border-color: color-mix(in srgb, var(--destaque) 50%, transparent); }

    /* ---------- Formulários ---------- */
    .rotulo-sat { display: block; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; opacity: .55; margin: 0 0 .3rem .5rem; color: var(--cor-terciaria); }
    .campo-sat {
        width: 100%; padding: .8rem 1rem; border-radius: 14px; font-size: .8rem; font-weight: 600;
        background: rgba(120,120,120,.08); border: 1px solid rgba(150,150,150,.22); color: var(--cor-terciaria); outline: none;
        transition: border-color .15s, box-shadow .15s;
    }
    .campo-sat:focus { border-color: var(--destaque); box-shadow: 0 0 0 3px color-mix(in srgb, var(--destaque) 20%, transparent); }
    .campo-sat.campo-compacto { padding: .6rem .7rem; font-size: .75rem; border-radius: 12px; }
    .campo-sat::placeholder { color: var(--cor-terciaria); opacity: .4; }
    .painel-sat input:focus, .painel-sat textarea:focus, .painel-sat select:focus { border-color: var(--destaque) !important; }
    .painel-sat input[type="checkbox"], .painel-sat input[type="radio"], .painel-sat input[type="range"] { accent-color: var(--destaque); }

    /* ---------- Selos de status ---------- */
    .selo-sat { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .6rem; border-radius: 9999px; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; }
    /* cor do texto puxada para a cor de texto da torcida: legível em fundo claro e escuro */
    .selo-amarelo { background: rgba(234,179,8,.18); color: color-mix(in srgb, #d97706 70%, var(--cor-terciaria)); }
    .selo-azul { background: rgba(59,130,246,.18); color: color-mix(in srgb, #2563eb 70%, var(--cor-terciaria)); }
    .selo-verde { background: rgba(34,197,94,.18); color: color-mix(in srgb, #16a34a 70%, var(--cor-terciaria)); }
    .selo-vermelho { background: rgba(239,68,68,.18); color: color-mix(in srgb, #dc2626 70%, var(--cor-terciaria)); }
    .selo-cinza { background: rgba(120,120,120,.15); color: var(--cor-terciaria); }
    .selo-destaque { background: color-mix(in srgb, var(--destaque) 18%, transparent); color: var(--cor-terciaria); }

    /* ---------- Atalhos de gestão ---------- */
    .atalho-sat {
        position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px;
        padding: 18px; border-radius: 22px; text-decoration: none;
        transition: transform .2s, border-color .2s;
    }
    .atalho-sat:active { transform: scale(.98); }
    .atalho-sat:hover { border-color: color-mix(in srgb, var(--destaque) 50%, transparent) !important; }
    .atalho-sat .icone, .icone-sat {
        width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        border-radius: 14px; color: var(--texto-destaque); font-size: 22px;
        background: linear-gradient(135deg, var(--destaque-claro), var(--destaque));
        box-shadow: 0 6px 14px color-mix(in srgb, var(--destaque) 30%, transparent);
    }
    .atalho-sat .icone.grafite, .icone-sat.grafite { color: #fff; background: linear-gradient(135deg, #5b6264, var(--sat-grafite)); box-shadow: 0 6px 14px rgba(0,0,0,.18); }
    .atalho-sat::after {
        content: ''; position: absolute; right: -14px; top: -10px; width: 70px; height: 84px;
        background: url("{% static 'img/logo-shield.png' %}") center / contain no-repeat; opacity: .05; pointer-events: none;
    }
</style>
