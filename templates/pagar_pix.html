{% extends "base.html" %}

{% block content %}
<style>
    :root { --cor-primaria: {{ fatura.assinatura.perfil.torcida.cor_primaria|default:"#D37129" }}; }
</style>

<div class="min-h-screen fundo-app flex flex-col items-center py-10 px-6">
    <div class="w-20 h-20 rounded-full flex items-center justify-center mb-6 mt-10 shadow-sm border" style="background-color: var(--cor-primaria); border-color: var(--cor-primaria); opacity: 0.9;">
        <i class="bi bi-qr-code-scan text-4xl text-white"></i>
    </div>
    
    <h1 class="text-2xl font-black italic uppercase texto-main text-center">
        PAGAMENTO <span style="color: var(--cor-primaria)">PIX</span>
    </h1>
    <p class="texto-main opacity-50 text-center mt-2 text-sm font-bold uppercase tracking-widest">Fatura #{{ fatura.id }} - {{ fatura.assinatura.plano.nome }}</p>
    
    {% if fatura.pix_qrcode %}
    <div class="mt-8 fundo-card p-6 rounded-2xl shadow-sm border border-suave w-full max-w-sm text-center">
        <p class="text-sm texto-main opacity-60 mb-4 font-bold">Valor: R$ {{ fatura.valor }}</p>
        
        <div class="p-2 fundo-app border border-suave rounded-xl mb-4 max-w-fit mx-auto">
            <img src="{{ fatura.pix_qrcode }}" alt="QR Code PIX" class="w-48 h-48 mx-auto rounded">
        </div>
        
        <p class="text-[10px] texto-main opacity-40 mb-2 font-black uppercase tracking-widest">Copiar Código PIX</p>
        <div class="flex items-center gap-2 fundo-app p-3 rounded-xl w-full border border-suave">
            <input type="text" id="pixCopiaCola" value="{{ fatura.pix_copia_e_cola }}" class="bg-transparent border-none text-xs w-full texto-main opacity-80 outline-none" readonly>
            <button type="button" onclick="copiarPix()" class="font-black uppercase text-xs px-2 whitespace-nowrap active:scale-95 transition-transform" style="color: var(--cor-primaria)"><i class="bi bi-copy"></i> Copiar</button>
        </div>
    </div>
    
    <script>
    function copiarPix() {
        var copyText = document.getElementById("pixCopiaCola");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value);
        alert("Código PIX copiado!");
    }
    </script>
    {% else %}
    <div class="mt-6 p-4 bg-red-500/10 text-red-600 border border-red-500/20 rounded-xl text-center text-sm font-bold max-w-sm w-full">
        Erro: QR Code PIX não disponível.
    </div>
    {% endif %}

    <div class="mt-8 w-full max-w-sm space-y-3">
        <a href="{% url 'dashboard' %}" class="block w-full py-4 text-white text-center rounded-2xl font-black italic uppercase text-xs shadow-md" style="background-color: var(--cor-primaria)">
            Voltar ao Início
        </a>
    </div>
</div>
{% endblock %}
