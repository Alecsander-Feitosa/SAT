{# Interações dos cards de post (curtir, comentar, abrir comentários). Incluído no mural, perfil público e post. #}
<style>
    .selo-dev { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 5px; font-size: 10px; color: #001b24; background: linear-gradient(135deg, #22d3ee, #a78bfa); box-shadow: 0 0 8px rgba(34,211,238,.7); flex-shrink: 0; }
    .selo-dev-nome { background: linear-gradient(90deg, #06b6d4, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent !important; text-shadow: none !important; }
    .selo-dev-nivel { background: linear-gradient(135deg, #22d3ee, #a78bfa); color: #001b24; }
    .selo-presidente { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 999px; font-size: 9px; color: #fff; flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .post-anuncio { border: 1.5px solid transparent !important; background: linear-gradient(var(--cor-secundaria), var(--cor-secundaria)) padding-box, linear-gradient(135deg, #22d3ee, #a78bfa) border-box !important; box-shadow: 0 0 18px rgba(34,211,238,.18); }
    .post-convocacao { border: 1.5px solid var(--cor-convocacao) !important; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    .menu-post > summary::-webkit-details-marker { display: none; }
</style>
<script>
    window.escaparHtml = function (texto) {
        return String(texto ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    };

    window.curtirPostAjax = function (event, form, postId) {
        event.preventDefault();
        fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(r => r.json())
            .then(data => {
                const icone = document.getElementById('icone-coracao-' + postId);
                const contador = document.getElementById('contador-curtidas-' + postId);
                if (contador && data.likes_count !== undefined) contador.innerText = data.likes_count;
                if (icone) icone.className = data.liked ? 'bi bi-heart-fill text-red-500 text-lg' : 'bi bi-heart texto-main opacity-40 text-lg';
            }).catch(console.error);
        return false;
    };

    window.comentarPostAjax = function (event, form, postId) {
        event.preventDefault();
        fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(r => r.json())
            .then(data => {
                if (!data.sucesso) {
                    if (window.Swal) Swal.fire({ icon: 'warning', title: 'Não foi possível comentar', text: data.erro || '' });
                    return;
                }
                form.querySelector('input[name="comentario"]').value = '';
                const contador = document.getElementById('contador-comentarios-' + postId);
                if (contador) contador.innerText = data.total_comentarios;
                const lista = document.getElementById('lista-comentarios-' + postId);
                const vazio = lista.querySelector('.no-comments-msg');
                if (vazio) vazio.remove();
                const foto = data.foto_autor
                    ? `<img src="${escaparHtml(data.foto_autor)}" class="w-full h-full object-cover" alt="">`
                    : '<i class="bi bi-person-fill texto-main opacity-30 text-xs"></i>';
                lista.insertAdjacentHTML('beforeend', `
                    <div class="flex gap-2 items-start animate-fade-up">
                        <div class="w-6 h-6 rounded-full overflow-hidden fundo-app border border-suave flex-shrink-0 mt-0.5 flex items-center justify-center">${foto}</div>
                        <div class="fundo-app border border-suave rounded-2xl rounded-tl-none px-3 py-2 flex-1">
                            <span class="text-[10px] font-black texto-main block mb-0.5">${escaparHtml(data.nome_autor)}</span>
                            <span class="text-xs texto-main opacity-80 leading-relaxed font-medium">${escaparHtml(data.texto)}</span>
                        </div>
                    </div>`);
                lista.scrollTop = lista.scrollHeight;
            }).catch(console.error);
        return false;
    };

    window.toggleComentarios = function (postId) {
        const div = document.getElementById('secao-comentarios-' + postId);
        if (div) div.classList.toggle('hidden');
    };
</script>
