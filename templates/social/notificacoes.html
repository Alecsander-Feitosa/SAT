{% extends 'base.html' %}
{% block content %}
<div class="w-full min-h-screen fundo-app flex flex-col pb-32">
    <div class="sticky top-[70px] z-40 fundo-card border-b border-suave shadow-sm px-5 py-4 flex items-center gap-4">
        <a href="javascript:history.back()" class="texto-main text-2xl no-underline"><i class="bi bi-arrow-left"></i></a>
        <h1 class="text-xl font-black italic uppercase tracking-tighter texto-main leading-none">Notifi<span class="texto-tema">cações</span></h1>
    </div>

    <div class="px-5 pt-5 max-w-2xl w-full mx-auto">
        <div class="fundo-card border border-suave rounded-[20px] overflow-hidden shadow-sm">
            {% for n in notificacoes %}
            <a href="{{ n.link|default:'#' }}" class="flex items-start gap-3 px-4 py-3 border-b border-suave last:border-0 no-underline {% if not n.lida %}bg-black/5{% endif %} hover:bg-black/5">
                <div class="relative w-10 h-10 shrink-0">
                    <div class="w-10 h-10 rounded-full overflow-hidden fundo-app border border-suave flex items-center justify-center">
                        {% if n.ator.perfil.foto %}<img src="{{ n.ator.perfil.foto.url }}" class="w-full h-full object-cover" alt="">
                        {% else %}<i class="bi bi-{% if n.tipo == 'nivel' or n.tipo == 'xp' %}stars{% elif n.tipo == 'moderacao' %}shield-exclamation{% else %}person-fill{% endif %} texto-main opacity-40 text-lg"></i>{% endif %}
                    </div>
                    <span class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full flex items-center justify-center text-[9px] text-white border-2 border-white
                        {% if n.tipo == 'curtida' %}bg-red-500{% elif n.tipo == 'comentario' %}bg-blue-500{% elif n.tipo == 'seguidor' or n.tipo == 'amigo' %}bg-green-500{% elif n.tipo == 'convocacao' %}bg-orange-500{% elif n.tipo == 'moderacao' %}bg-gray-700{% elif n.tipo == 'pedido' %}bg-green-600{% else %}bg-yellow-500{% endif %}">
                        <i class="bi bi-{% if n.tipo == 'curtida' %}heart-fill{% elif n.tipo == 'comentario' %}chat-fill{% elif n.tipo == 'seguidor' %}person-plus-fill{% elif n.tipo == 'amigo' %}people-fill{% elif n.tipo == 'convocacao' %}megaphone-fill{% elif n.tipo == 'moderacao' %}shield-fill{% elif n.tipo == 'pedido' %}bag-check-fill{% elif n.tipo == 'evento_epico' %}lightning-fill{% else %}star-fill{% endif %}"></i>
                    </span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm texto-main leading-snug {% if not n.lida %}font-bold{% endif %}">{{ n.texto }}</p>
                    <p class="text-[10px] texto-main opacity-50 font-bold mt-0.5">{{ n.criada_em|timesince }} atrás</p>
                </div>
                {% if not n.lida %}<span class="w-2.5 h-2.5 rounded-full fundo-tema mt-2 shrink-0"></span>{% endif %}
            </a>
            {% empty %}
            <div class="p-10 text-center">
                <i class="bi bi-bell-slash texto-main opacity-30 text-3xl"></i>
                <p class="text-[10px] font-black uppercase tracking-widest texto-main opacity-50 mt-2">Nenhuma notificação ainda</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
