{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="w-full min-h-screen fundo-app pt-6 pb-24 px-4">

    {% if status == 'pendente' %}
        <div class="flex flex-col items-center justify-center mb-8 p-6 fundo-card rounded-3xl border border-suave text-center">
            <i class="bi bi-shield-lock-fill text-4xl texto-main mb-2"></i>
            <h2 class="font-black text-lg text-white uppercase">Aguardando Aprovação</h2>
            <p class="text-xs text-white opacity-70 mb-4">Solicitação para {{ torcida.nome }} enviada.</p>
            
            <a href="{% url 'cancelar_vinculo' %}" class="bg-red-600 text-white px-6 py-2 rounded-xl text-sm font-bold uppercase">
                Cancelar Solicitação
            </a>
        </div>
    {% endif %}

    <div class="mb-6">
        <h2 class="font-black text-xl texto-main uppercase">Escolha a sua Torcida</h2>
    </div>
    
    <div class="flex flex-col gap-4">
        {% for t in torcidas %}
            <div class="fundo-card p-4 rounded-2xl border border-suave flex items-center gap-4">
                <div class="flex-1">
                    <h3 class="font-black texto-main text-sm uppercase">{{ t.nome }}</h3>
                </div>
                
                <a href="{% url 'vincular_torcida' t.id %}" class="fundo-tema texto-claro px-4 py-2 rounded-xl text-xs font-black uppercase shadow-sm">
                    Entrar
                </a>
            </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
